[build-system]
requires = [ "setuptools>=77", "setuptools-scm",]
build-backend = "setuptools.build_meta"

[project]
name = "arches-vue-components"
version = "2.1.0a2"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = [ "LICENSE",]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [ "arches>=8.2.0a8", "arches-querysets[drf]<2.0.0,>=1.3.0a1",]
dynamic = []

[[project.authors]]
name = "Arches Project"

[project.urls]
Homepage = "https://archesproject.org/"
Documentation = "https://arches.readthedocs.io"
Repository = "https://github.com/archesproject/arches-vue-components.git"
Issues = "https://github.com/archesproject/arches-vue-components/issues"

[tool.setuptools]
packages = [ "arches_vue_components",]

[dependency-groups]
dev = [ "black==26.3.1", "coverage", "django-silk==5.5.0", "livereload", "pre-commit==4.6.1", "sst",]
